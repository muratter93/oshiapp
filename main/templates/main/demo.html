{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Scroll Demo</title>
    <link rel="stylesheet" href="{% static 'css/demo.css' %}">
</head>
<body>

<header class="header">
    <h1>スクロールで画像が出るデモ</h1>
</header>

<section class="spacer">
    <p>スクロールしてね ↓</p>
</section>

<section class="scroll-section">

    <div class="scroll-item from-left">
        <img src="{% static 'img/demo1.png' %}" alt="">
    </div>

    <div class="scroll-item from-right">
        <img src="{% static 'img/demo2.png' %}" alt="">
    </div>

    <div class="scroll-item from-left">
        <img src="{% static 'img/demo3.png' %}" alt="">
    </div>

    <div class="scroll-item from-right">
        <img src="{% static 'img/demo4.png' %}" alt="">
    </div>

</section>

<section class="spacer">
    <p>終わり</p>
</section>

<script src="{% static 'js/demo.js' %}"></script>
</body>
</html>
