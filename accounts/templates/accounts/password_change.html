{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワード変更</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<div class="container">

    <!-- 左側 -->
    <div class="left-side">
        <img src="{% static 'img/animalmania_logo.png' %}" class="logo-img">
        <img src="{% static 'img/Ailurus_fulgens.png' %}" class="left-illustration-top">
        <img src="{% static 'img/kaba.png' %}" class="left-illustration-bottom">
    </div>

    <!-- 右側 -->
    <div class="right-side">

        <div class="login-box">
            <h2>パスワード変更</h2>

            <form method="post">
                {% csrf_token %}

                <!-- 現在のパスワード -->
                <div class="password-wrap">
                    <input type="password" name="old_password"
                           id="old_password"
                           class="input-field"
                           placeholder="現在のパスワード" required>
                    <button type="button" onclick="togglePassword('old_password')" class="eye-btn">👁</button>
                </div>

                <!-- 新しいパスワード -->
                <div class="password-wrap">
                    <input type="password" name="new_password1"
                           id="new_password1"
                           class="input-field"
                           placeholder="新しいパスワード" required
                           pattern="(?=.*[0-9])(?=.*[a-zA-Z])(?=.*[!@#$%^&*]).{8,}"
                           title="英字・数字・記号を含む8文字以上で入力してください">
                    <button type="button" onclick="togglePassword('new_password1')" class="eye-btn">👁</button>
                </div>

                <!-- 確認 -->
                <div class="password-wrap">
                    <input type="password" name="new_password2"
                           id="new_password2"
                           class="input-field"
                           placeholder="パスワード（確認）" required>
                    <button type="button" onclick="togglePassword('new_password2')" class="eye-btn">👁</button>
                </div>

                <button type="submit" class="login-button">変更する</button>
            </form>

            {% if form.errors %}
                <div class="error">
                    {% for field in form %}
                        {% for error in field.errors %}
                            <p>{{ error }}</p>
                        {% endfor %}
                    {% endfor %}
                    {% for error in form.non_field_errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}

        </div>

    </div>
</div>

<script>
function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
