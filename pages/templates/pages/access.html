{% extends "common/base.html" %}
{% load static %}

{% block title %}アクセス{% endblock %}

{% block content %}

<h1>アクセス</h1>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin=""
/>

<style>
  #map{
    height:65vh;
    width:100%;
    border-radius:12px;
    box-shadow:0 4px 16px rgba(0,0,0,.12);
    position:relative;
  }

  .jump-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:.5rem;
    margin-top:.75rem;
  }

  .jump-buttons button{
    padding:.6rem .8rem;
    border-radius:.75rem;
    border:1px solid #e5e7eb;
    background:#fff;
    cursor:pointer;
    font-weight:600;
  }

  .jump-buttons button:hover{
    background:#f3f4f6;
  }

  .jump-buttons .full-width{
    grid-column:1 / -1;
  }

  .zoo-label-text{
    font-size:.75rem;
    font-weight:bold;
    color:#111;
    white-space:nowrap;
    position:relative;
    left:50%;
    transform:translate(calc(-50% + 15px), -28px);
  }

  .zoo-info{
    margin:32px 0;
  }

  .zoo-info__title{
    font-size:18px;
    font-weight:800;
    margin:10px 0 12px;
  }

  .zoo-info__grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:.75rem;
  }

  .zoo-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:12px 14px;
  }

  .zoo-card__name{
    font-size:16px;
    font-weight:800;
    margin:0 0 10px;
  }

  .zoo-card__row{
    display:flex;
    gap:10px;
    margin:6px 0;
  }

  .zoo-card__label{
    width:72px;
    color:#6b7280;
    font-size:13px;
    flex:0 0 auto;
  }

  .zoo-card__value{
    font-size:14px;
    font-weight:700;
    color:#111827;
  }

  .zoo-card__note{
    font-size:12px;
    font-weight:500;
    color:#6b7280;
    margin-left:4px;
    white-space:nowrap;
  }

  @media(max-width:900px){
    .zoo-info__grid{grid-template-columns:1fr;}
  }

  /* 同じレイヤーにそろえる */
  #map,
  .jump-buttons,
  .zoo-info,
  .zoo-card{
    position:relative;
    z-index:0;
  }

  .leaflet-container,
  .leaflet-pane,
  .leaflet-top,
  .leaflet-bottom{
    z-index:0 !important;
  }

  .access-wrap{
  padding-right: 100px;
  box-sizing: border-box;
  }

</style>

<div class="access-wrap">

<div id="map"></div>

<div class="jump-buttons">
  <button class="full-width" onclick="resetView()">🗺️ 全体マップ表示</button>
  <button onclick="flyToSpot('jyouyama')">🐒 城山動物園</button>
  <button onclick="flyToSpot('chausuyama')">🐘 茶臼山動物園</button>
  <button onclick="flyToSpot('suzaka')">🦘 須坂市動物園</button>
  <button onclick="openStreetView('jyouyama')">🚶 城山動物園ストリートビュー</button>
  <button onclick="openStreetView('chausuyama')">🚶 茶臼山動物園ストリートビュー</button>
  <button onclick="openStreetView('suzaka')">🚶 須坂市動物園ストリートビュー</button>
</div>

<section class="zoo-info">
  <h2 class="zoo-info__title">営業時間・料金</h2>
  <div id="zooInfoGrid" class="zoo-info__grid"></div>
</section>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const spots = [
  {
    id:'jyouyama',
    name:'🐒城山動物園',
    lat:36.66490806254121,
    lng:138.1942988606473,
    zoom:16,
    sv_lat:36.665244588523024,
    sv_lng:138.1935118468303,
    sv_heading:130,
    address:'〒380-0802 長野県長野市上松２丁目１−１９',
    tel:'026-233-0586',
    open:'09:00',
    close:'16:30',
    open_note:'（冬季変動あり）',
    price:'入園無料'
  },
  {
    id:'chausuyama',
    name:'🐘茶臼山動物園',
    lat:36.58530392097484,
    lng:138.11518754155875,
    zoom:16,
    sv_lat:36.583904,
    sv_lng:138.114083,
    sv_heading:0,
    address:'〒388-8016 長野県長野市篠ノ井有旅５７０−１',
    tel:'026-293-5167',
    open:'09:30',
    close:'16:30',
    open_note:'（季節変動あり）',
    price:'大人 600円 / 小・中学生 100円'
  },
  {
    id:'suzaka',
    name:'🦘須坂市動物園',
    lat:36.6423500355432,
    lng:138.31111727750795,
    zoom:16,
    sv_lat:36.643277,
    sv_lng:138.311711,
    sv_heading:180,
    address:'〒382-0028 長野県須坂市臥竜２丁目４−８',
    tel:'026-245-1770',
    open:'09:00',
    close:'16:45',
    open_note:'（最終入園16:00）',
    price:'高校生以上 200円 / 中学生以下 70円'
  }
];

const map = L.map('map', {
  center: [0, 0],
  zoom: 2,

  zoomAnimation: true,
  markerZoomAnimation: true,
  fadeAnimation: true,

  zoomSnap: 0.25,
  zoomDelta: 0.25,

  wheelDebounceTime: 20,
  wheelPxPerZoomLevel: 80,

  preferCanvas: true
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

const markers=[];
const labelMarkers=[];

spots.forEach(s=>{
  const marker=L.marker([s.lat,s.lng]).addTo(map).bindPopup(
    `<b>${s.name}</b><br>${s.address}<br>☎ ${s.tel}`
  );
  marker.on('click',()=>{
    map.flyTo([s.lat,s.lng],s.zoom,{duration:.6});
    marker.openPopup();
  });
  markers.push(marker);

  labelMarkers.push(
    L.marker([s.lat,s.lng],{
      icon:L.divIcon({
        html:`<div class="zoo-label-text" onclick="flyToSpot('${s.id}')">${s.name}</div>`,
        iconSize:[0,0]
      }),
      interactive:true
    })
  );
});

const group=L.featureGroup(markers);
const fullBounds=group.getBounds().pad(0.2);

function applyFullView({ animate }) {
  map.fitBounds(fullBounds, {
    padding: [20, 20],
    animate,
    duration: 0.8,
    easeLinearity: 0.25
  });
}


let baseZoom,minLabelZoom,maxLabelZoom;

function updateLabelsVisibility(){
  if(baseZoom==null)return;
  const z=Math.round(map.getZoom());
  if(z>=minLabelZoom&&z<=maxLabelZoom){
    labelMarkers.forEach(l=>!map.hasLayer(l)&&l.addTo(map));
  }else{
    labelMarkers.forEach(l=>map.hasLayer(l)&&map.removeLayer(l));
  }
}

map.on('zoomend',updateLabelsVisibility);

function renderZooInfo(){
  const el=document.getElementById('zooInfoGrid');
  el.innerHTML=spots.map(s=>`
    <article class="zoo-card">
      <h3 class="zoo-card__name">${s.name}</h3>
      <div class="zoo-card__row">
        <div class="zoo-card__label">営業時間</div>
        <div class="zoo-card__value">
          ${s.open} 〜 ${s.close}
          ${s.open_note?`<span class="zoo-card__note">${s.open_note}</span>`:''}
        </div>
      </div>
      <div class="zoo-card__row">
        <div class="zoo-card__label">料金</div>
        <div class="zoo-card__value">${s.price}</div>
      </div>
    </article>
  `).join('');
}

window.addEventListener('load',()=>{
  map.invalidateSize();
  applyFullView({animate:false});
  baseZoom=Math.round(map.getZoom());
  minLabelZoom=baseZoom-2;
  maxLabelZoom=baseZoom+2;
  updateLabelsVisibility();
  renderZooInfo();
});

function flyToSpot(id){
  const s=spots.find(x=>x.id===id);
  if(!s)return;
  map.flyTo([s.lat,s.lng],s.zoom,{duration:.6});
  markers[spots.indexOf(s)].openPopup();
}

function resetView(){
  applyFullView({animate:true});
  map.closePopup();
}

function openStreetView(id){
  const s=spots.find(x=>x.id===id);
  if(!s)return;
  const lat=s.sv_lat??s.lat;
  const lng=s.sv_lng??s.lng;
  const heading=s.sv_heading??0;
  window.open(
    `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}&heading=${heading}&pitch=0&fov=80`,
    '_blank'
  );
}
</script>

<div id="access_returntop_button">
  <a href="{% url 'main:index' %}#">▶トップページへもどる</a>
</div>

{% endblock %}
